<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline</title>
<style>
  html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:grid;place-content:center;gap:1rem;padding:2rem;text-align:center}
  h1{margin:0;font-size:clamp(2rem,8vw,3.5rem);letter-spacing:-.02em}
  p{margin:0;color:#a3a3a3}
  button{justify-self:center;margin-top:.5rem;padding:.75rem 1.5rem;border:1px solid #fff;background:none;color:#fff;font:inherit;cursor:pointer}
  button:hover,button:focus-visible{background:#fff;color:#000}
</style>
</head>
<body>
<main>
  <h1>You're offline.</h1>
  <p>This page needs a connection. Pages you have already opened still work.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
